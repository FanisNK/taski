version: '3.8'

volumes:
  pg_data:
  static_value:

services:
  db:
    image: postgres:13.10
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    image: fanis777/taski_backend:latest
    env_file: .env
    volumes:
      - static_value:/backend_static
    depends_on:
      - db

  frontend:
    image: fanis777/taski_frontend:latest
    command: cp -r /app/build/. /var/html/frontend/

  gateway:
    image: fanis777/taski_gateway:latest
    ports:
      - "8000:80"
    volumes:
      - static_value:/staticfiles/
    depends_on:
      - backend
      - frontend
